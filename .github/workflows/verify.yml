name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The pinned tables in impl2/testdata are cut from the reference
          # implementation's Unicode data. A different minor version folds
          # different code points, and the differential test then reports a
          # disagreement that belongs to the environment, not to the format.
          python-version: "3.14"

      - uses: actions/setup-go@v5
        with:
          go-version-file: MIR/impl2/go.mod
          cache: false

      - name: run the suite
        working-directory: MIR
        run: python3 ci/check.py
